presets:
  # Emitted in order into the ALBERS_TOKENS_PRESETS block of albers.css by
  # tools/sync_albers_assets.R. Every key becomes a custom property
  # (snake_case -> --kebab-case); `comment` is the block comment.
  homage:
    comment: "Homage direction: warm cream ground, Newsreader serif body, light code.\n   Matches the :root default; present so the class is explicit and idempotent."
    bg: "#efe7d6"
    surface: "#fbf7ee"
    surface_strong: "#f4eedf"
    ink: "#1f1b16"
    muted: "#6b6355"
    border: "#e0d6c0"
    code_bg: "#f6f0e3"
    code_fg: "#332f28"
    code_border: "#e6dcc6"
    code_out: "#5a5244"
    tok_fun: "var(--A700)"
    tok_str: "var(--comp-ink)"
    tok_num: "var(--code-num)"
    tok_com: "#6c6250"
    tok_kw: "#1f1b16"
    tok_arg: "#5b5344"
    font_body: '"Newsreader", "Newsreader Fallback", Georgia, "Times New Roman", serif'
    font_display: '"Familjen Grotesk", "Familjen Grotesk Fallback", system-ui, sans-serif'
    font_ui: '"Familjen Grotesk", "Familjen Grotesk Fallback", system-ui, sans-serif'
    font_mono: '"Spline Sans Mono", ui-monospace, "SFMono-Regular", Menlo, monospace'
    sq_outer: "var(--comp)"
    heading_weight: 700
  interaction:
    comment: "Interaction direction: cool grey ground, all-grotesk, dark code blocks."
    bg: "#eceef1"
    surface: "#ffffff"
    surface_strong: "#f5f6f8"
    ink: "#15181e"
    muted: "#5d6573"
    border: "#e1e4e9"
    code_bg: "color-mix(in oklab, var(--A900) 24%, #101217)"
    code_fg: "#d3d8e1"
    code_border: "transparent"
    code_out: "#aab3c2"
    tok_fun: "var(--A300)"
    tok_str: "var(--code-str-light)"
    tok_num: "var(--code-num-light)"
    tok_com: "#8d96a6"
    tok_kw: "#f3f4f6"
    tok_arg: "#b4bccb"
    code_warn: "#f0b847"
    code_err: "#ff8b7b"
    font_body: '"Hanken Grotesk", "Hanken Grotesk Fallback", system-ui, sans-serif'
    font_display: '"Space Grotesk", "Space Grotesk Fallback", system-ui, sans-serif'
    font_ui: '"Hanken Grotesk", "Hanken Grotesk Fallback", system-ui, sans-serif'
    font_mono: '"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace'
    sq_outer: "var(--comp)"
    heading_weight: 600
    fs_body: "16.5px"
    lh_body: 1.64
    content: "35.84em" # 64ch of Hanken Grotesk, in em: ch changed when the web font arrived
  study:
    bg: "#f7f9fb"
    surface: "#ffffff"
    surface_strong: "#fbfcfd"
    ink: "#17181a"
    muted: "#5f6873"
    border: "#dde2e8"
    code_bg: "#f1f4f8"
    font_display: '"Familjen Grotesk", "Familjen Grotesk Fallback", system-ui, sans-serif'
    heading_weight: 730
  structural:
    bg: "#e6e9ed"
    surface: "#f1f3f6"
    surface_strong: "#eceff2"
    ink: "#101214"
    muted: "#4b5360"
    border: "#c1c8d0"
    code_bg: "#e0e5ea"
    shadow_soft: "none"
    shadow_card: "none"
    font_display: '"Familjen Grotesk", "Familjen Grotesk Fallback", system-ui, sans-serif'
    heading_weight: 760
  adobe:
    bg: "#ece9e7"
    surface: "#f3f1ef"
    surface_strong: "#efedeb"
    ink: "#1f1c19"
    muted: "#5e5955"
    border: "#ccc7c3"
    code_bg: "#e3dfdc"
    shadow_soft: "0 2px 7px rgba(0, 0, 0, 0.04)"
    shadow_card: "0 2px 9px rgba(0, 0, 0, 0.05)"
    font_display: '"Familjen Grotesk", "Familjen Grotesk Fallback", system-ui, sans-serif'
    heading_weight: 720
  midnight:
    comment: "Midnight preset: the family's A900 sunk into ink, so the page itself is the\n   plate (oxblood-black for red, ultramarine-black for lapis). Code sits on\n   the deepest plate in the plate's own squares: functions the family's light\n   ring, numbers its deeper ring, strings the complement, where dark\n   Interaction keeps pale tints and a third hue."
    bg: "color-mix(in oklab, var(--A900) 22%, #07080c)"
    surface: "color-mix(in oklab, var(--A900) 24%, #0e1016)"
    surface_strong: "color-mix(in oklab, var(--A900) 26%, #13161d)"
    ink: "#e8e6e1"
    muted: "#b6b4ae"
    border: "color-mix(in oklab, var(--A900) 30%, #262a33)"
    code_bg: "color-mix(in oklab, var(--A900) 30%, #04050a)"
    code_fg: "#dcdad3"
    code_border: "color-mix(in oklab, var(--A900) 30%, #262a33)"
    code_out: "#b0aea7"
    tok_fun: "var(--code-fun-night)"
    tok_str: "var(--code-str-night)"
    tok_num: "var(--code-num-night)"
    tok_com: "#a3a19a"
    tok_kw: "#f3f2ee"
    tok_arg: "#bdbab2"
    warn: "#f0b429"
    danger: "#ff8a73"
    shadow_soft: "0 6px 20px rgba(0, 0, 0, 0.4)"
    shadow_card: "0 6px 24px rgba(0, 0, 0, 0.45)"
    font_display: '"Familjen Grotesk", "Familjen Grotesk Fallback", system-ui, sans-serif'
    heading_weight: 740
    accent_ink: "var(--accent-ink-dark)"
    color_scheme: "dark"
